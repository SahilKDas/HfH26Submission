name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unspool_test
          POSTGRES_USER: unspool
          POSTGRES_PASSWORD: unspool_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unspool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://unspool:unspool_ci@127.0.0.1:5432/unspool_test
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: bun install --frozen-lockfile
      - run: pip install -r requirements.txt
      - run: bun run check:svelte
      - run: bun run test
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test core.tests
      - run: bun run build
