services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unspool
      POSTGRES_USER: unspool
      POSTGRES_PASSWORD: unspool-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unspool"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - unspool-postgres:/var/lib/postgresql/data
  web:
    build: .
    environment: &backend-env
      DATABASE_URL: postgresql://unspool:unspool-local-only@postgres:5432/unspool
      DJANGO_SECRET_KEY: local-compose-secret-change-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      PROFILE_COOKIE_SECURE: "0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    build: .
    command: python backend/manage.py runworker
    environment: *backend-env
    depends_on:
      web:
        condition: service_healthy
volumes:
  unspool-postgres:
